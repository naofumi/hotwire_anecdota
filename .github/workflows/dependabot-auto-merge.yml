name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  handle-ci:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Handle Dependabot CI result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const repoId = context.payload.repository.id;
            const base = 'master';

            if (run.path !== '.github/workflows/ci.yml' || !run.head_sha) return;

            // The event may omit its associated PRs. Resolve the open PR by its head branch.
            const matchesRun = pr =>
              pr.state === 'open' &&
              pr.user?.login === 'dependabot[bot]' &&
              pr.user?.type === 'Bot' &&
              pr.base.ref === base &&
              pr.base.repo?.id === repoId &&
              pr.head.repo?.id === repoId &&
              pr.head.ref === run.head_branch &&
              pr.head.sha === run.head_sha;

            const {data: candidates} = await github.rest.pulls.list({
              ...repo, state: 'open', base, head: `${repo.owner}:${run.head_branch}`
            });
            const candidate = candidates.find(matchesRun);
            if (!candidate) {
              core.info('No open Dependabot PR on master matches the tested head.');
              return;
            }

            if (run.conclusion === 'success') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, filter: 'latest', per_page: 100
              });
              const requiredChecks = ['scan_ruby', 'lint', 'test'];
              if (!requiredChecks.every(name => {
                const matchingJobs = jobs.filter(job => job.name === name);
                return matchingJobs.length === 1 && matchingJobs[0].conclusion === 'success';
              })) {
                core.info('The run did not pass all three required jobs.');
                return;
              }
            }

            // A newer run or rerun on the same head can supersede this event.
            const {data: {workflow_runs: [latest]}} = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: run.workflow_id, event: 'pull_request',
              branch: run.head_branch, head_sha: run.head_sha, per_page: 1
            });
            if (latest?.id !== run.id || latest.run_attempt !== run.run_attempt ||
                latest.status !== 'completed' || latest.conclusion !== run.conclusion) {
              core.info('A newer CI run or attempt superseded this result.');
              return;
            }

            const pull = {...repo, pull_number: candidate.number};
            const {data: pr} = await github.rest.pulls.get(pull);
            if (!matchesRun(pr)) {
              core.info('The pull request changed after this run.');
              return;
            }

            if (run.conclusion === 'failure' || run.conclusion === 'timed_out') {
              await github.rest.issues.addAssignees({
                ...repo, issue_number: pr.number, assignees: ['naofumi']
              });
              core.info(`Assigned #${pr.number} to naofumi after CI ${run.conclusion}.`);
              return;
            }
            if (pr.draft) return;

            let merge;
            try {
              ({data: merge} = await github.rest.pulls.merge({
                ...pull, sha: run.head_sha, merge_method: 'squash'
              }));
            } catch (error) {
              if (error.status !== 409) throw error;
              core.info('The pull request head changed before the merge.');
              return;
            }
            if (!merge.merged) throw new Error(merge.message);
            core.info(`Squash-merged #${pr.number} as ${merge.sha}.`);

            // A merge made with GITHUB_TOKEN does not trigger push CI.
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: run.workflow_id, ref: base
            });
            core.info(`Dispatched CI on ${base}.`);
